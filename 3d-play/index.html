<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Banana的岁时漫游 · 团结引擎版</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#061a16;overflow:hidden;font-family:"Noto Serif SC","Songti SC","STSong",serif;color:#eef3e6;}
  #stage{position:fixed;top:0;left:0;right:0;bottom:0;background:#061a16}
  #tuanjie-canvas{position:fixed;left:0;top:0;width:100%;height:100%;outline:none;touch-action:none}
  canvas{display:block}
  #ui{position:fixed;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;pointer-events:none;}
  #bar{width:220px;height:2px;background:rgba(238,243,230,.15);margin:18px auto 0}#bar i{display:block;height:100%;width:0;background:rgba(238,243,230,.7);transition:width .3s}
  #ui *{pointer-events:none}
  #chapter{position:absolute;left:34px;top:26px;font-size:15px;letter-spacing:.12em;opacity:.85;text-shadow:0 1px 8px rgba(0,0,0,.45);display:flex;align-items:baseline}
  #chapter>*+*{margin-left:12px}
  #chapter .num{font-size:12px;opacity:.7;letter-spacing:.2em}
  #chapter .sep{opacity:.35;margin:0 2px}
  #chapter .season{font-size:12px;opacity:.65}
  #chapter.pop{animation:pop 1.6s ease-out}
  @keyframes pop{0%{opacity:0;transform:translateY(6px)}30%{opacity:1;transform:none}}
  #age{position:absolute;right:36px;top:28px;font-size:12px;letter-spacing:.2em;opacity:.55;text-shadow:0 1px 8px rgba(0,0,0,.45)}
  #sub{position:absolute;left:0;right:0;bottom:96px;text-align:center;font-size:21px;letter-spacing:.14em;opacity:0;transition:opacity 1.4s ease;text-shadow:0 2px 14px rgba(0,0,0,.55),0 0 2px rgba(0,0,0,.6)}
  #sub.show{opacity:.95}
  #hint{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:13px;letter-spacing:.2em;opacity:0;transition:opacity .8s;color:#dbe7d2}
  #hint.show{opacity:.7}
  #ui.is-touch #hint{bottom:112px}
  #ui.is-touch #sub{bottom:150px}
  #toast{position:absolute;left:0;right:0;top:120px;text-align:center;font-size:15px;letter-spacing:.16em;opacity:0;transition:opacity 1.2s;color:#f6efcf;text-shadow:0 2px 12px rgba(0,0,0,.5)}
  #toast.show{opacity:.9}
  #title{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(3,18,14,.55);transition:opacity 1.8s}
  @supports ((-webkit-backdrop-filter:blur(2px)) or (backdrop-filter:blur(2px))){#title{background:rgba(3,18,14,.42);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}}
  #title.hidden{opacity:0}
  #title .t1{font-size:46px;letter-spacing:.32em;text-indent:.32em;font-weight:600;text-shadow:0 4px 30px rgba(0,0,0,.6)}
  #title .t2{font-size:11px;letter-spacing:.45em;opacity:.6;margin-top:14px}
  #title .t3{font-size:13px;letter-spacing:.2em;opacity:.75;margin-top:70px;text-align:center;line-height:2.2}
  #title .t3 span{opacity:.6;animation:blink 2.4s infinite}
  @keyframes blink{50%{opacity:.15}}
  /* on-screen controls (touch devices only) */
  #touch{position:absolute;top:0;left:0;right:0;bottom:0}
  #touch.hidden{display:none}
  #ui #touch [data-act],#ui #journal,#ui #journal .paper,#ui #journal [data-act]{pointer-events:auto}
  #ui #journal.hidden,#ui #journal.hidden *{pointer-events:none}
  .tzone{position:absolute;top:120px;bottom:0;width:38%;display:flex;align-items:flex-end;padding-bottom:110px;color:rgba(238,243,230,.35);font-size:64px;line-height:1}
  .tzone.left{left:0;justify-content:flex-start;padding-left:34px}.tzone.right{right:0;justify-content:flex-end;padding-right:34px}
  .tzone i{font-style:normal;opacity:.6;transition:opacity .2s}.tzone.on i{opacity:1}
  .tbtn{position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(6,26,22,.42);border:1px solid rgba(238,243,230,.35);color:#eef3e6;font-size:16px;letter-spacing:.1em;display:flex;align-items:center;justify-content:center;text-align:center}
  .tbtn.on{background:rgba(238,243,230,.28)}
  .tbtn.jump{right:34px;bottom:34px}.tbtn.sit{right:118px;bottom:34px}
  .tbar{position:absolute;right:34px;top:60px;display:flex}
  .tbar .tbtn{position:static;width:auto;height:30px;padding:0 12px;border-radius:15px;font-size:12px}
  .tbar .tbtn.icon{font-size:17px;padding:0 10px;letter-spacing:0}
  .tbar .tbtn+.tbtn{margin-left:8px}
  .tbtn.active{background:rgba(238,243,230,.3)}
  #ui .tips{display:none}#ui.is-touch .tips{display:inline}#ui.is-touch .keys{display:none}
  .jnav{display:none;margin-right:16px;padding:2px 8px;border:1px solid rgba(44,58,48,.35);border-radius:4px}
  #ui.is-touch .jnav{display:inline-block}
  #journal{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:rgba(4,20,16,.55);transition:opacity .5s}
  #journal.hidden{opacity:0;visibility:hidden}
  .paper{width:760px;padding:34px 44px;background:rgba(238,240,226,.94);color:#2c3a30;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .jhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(44,58,48,.25);padding-bottom:12px;margin-bottom:16px}
  .paper{position:relative}
  .jclose{position:absolute;right:10px;top:8px;width:36px;height:36px;line-height:36px;text-align:center;font-size:20px;color:#2c3a30;opacity:.6;cursor:pointer}
  .jhead{padding-right:36px}
  .jhead b{font-size:22px;letter-spacing:.3em;font-weight:600}.jhead span{font-size:12px;letter-spacing:.2em;opacity:.7}
  .jgrid{display:grid;grid-template-columns:repeat(6,1fr);grid-gap:8px}
  .cell{padding:9px 6px;border-radius:4px;background:rgba(44,58,48,.05);text-align:center;opacity:.38}
  .cell.on{opacity:1;background:rgba(120,160,110,.2)}
  .cell i{display:block;font-style:normal;font-size:9px;letter-spacing:.2em;opacity:.6}.cell b{display:block;font-size:17px;font-weight:600;margin:2px 0}.cell s{display:block;text-decoration:none;font-size:10px;opacity:.7;letter-spacing:.1em}
  .jeggs{margin-top:18px;border-top:1px solid rgba(44,58,48,.25);padding-top:12px;font-size:13px;max-height:150px;overflow:hidden}
  .eh{letter-spacing:.2em;opacity:.7;font-size:12px;margin-bottom:6px}.egg{line-height:1.9}.egg span{opacity:.6;font-size:11px;margin-left:10px}.egg.dim{opacity:.55}
  .jfoot{margin-top:14px;font-size:11px;letter-spacing:.2em;opacity:.55;text-align:right}
</style>
</head>
<body>
<div id="stage"><canvas id="tuanjie-canvas" tabindex="-1"></canvas></div>
<div id="ui"></div>
<script src="Build/web.loader.js"></script>
<script type="module">
import { TERMS, SEASON_NAMES } from './season.js';
import { Audio } from './audio.js';
const root = document.getElementById('ui');
const touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
root.classList.toggle('is-touch', touch);
root.innerHTML = `
  <div id="chapter"><span class="num"></span><span class="name"></span><span class="sep">|</span><span class="season"></span></div>
  <div id="age"></div><div id="sub"></div><div id="hint"></div><div id="toast"></div>
  <div id="journal" class="hidden"><div class="paper"><span class="jclose" data-act="journal">✕</span><div class="jhead"></div><div class="jgrid"></div><div class="jeggs"></div><div class="jfoot"><span class="jnav" data-act="jprev">‹ 上一年</span><span class="jnav" data-act="jnext">下一年 ›</span><span class="keys">← → 翻年　·　J / Esc 合上</span><span class="tips">点 ✕ 或空白处合上</span></div></div></div>
  <div id="touch" class="hidden">
    <div class="tzone left" data-act="left"><i>‹</i></div><div class="tzone right" data-act="right"><i>›</i></div>
    <div class="tbtn jump" data-act="jump">跳</div><div class="tbtn sit" data-act="sit">坐</div>
    <div class="tbar"><div class="tbtn small" data-act="cam">视角</div><div class="tbtn small" data-act="journal">手记</div><div class="tbtn small" data-act="auto">漫游</div><div class="tbtn small icon" data-act="mute">🔊</div></div>
  </div>
  <div id="title"><div class="t1">Banana的岁时漫游</div><div class="t2">A YEAR-LONG WALK THROUGH THE FOREST · TUANJIE</div>
    <div class="t3"><span class="keys">A / D 慢慢走 · Shift 小跑 · 空格 跳 · E 坐下 · C 换视角 · R 自动漫游 · J 手记<br>鼠标拖动转镜头 · 滚轮远近<br></span><span class="tips">按住画面左右两侧慢慢走 · 右下角跳、坐下 · 右上角换视角<br></span><span id="status">正在长出森林…</span></div><div id="bar"><i></i></div></div>`;
const q = s => root.querySelector(s);
let inst = null, ready = false, started = false, muted = false;
const audio = new Audio();
const send = a => { if (inst) inst.SendMessage('Game', 'OnAction', a); };
// subtitles queue
const subQ = []; let subCur = null, subT = 0, last = performance.now(), lastTerm = -1;
const A = { snow: 0, rain: 0, leaf: 1, night: 0, water: 0, sitting: 0 };
// ---- journal: which terms each year has walked through, and the small things met on the way
const JKEY = 'banana.tuanjie.journal';
let J; try { J = JSON.parse(localStorage.getItem(JKEY)); } catch (e) {}
if (!J || !J.years) J = { age: 0, years: { 0: { seen: [] } }, eggs: {} };
const saveJ = () => { try { localStorage.setItem(JKEY, JSON.stringify(J)); } catch (e) {} };
let journalOpen = false, journalYear = 0;
function showJournal() {
  const y = journalYear, seen = (J.years[y] && J.years[y].seen) || [];
  q('.jhead').innerHTML = `<b>岁时手记</b><span>第 ${y + 1} 年${y === J.age ? ' · 正在经历' : ' · 已珍藏'}</span>`;
  q('.jgrid').innerHTML = TERMS.map((t, i) => `<div class="cell ${seen.includes(i) ? 'on' : ''}"><i>${String(i + 1).padStart(2, '0')}</i><b>${t[0]}</b><s>${t[1]}</s></div>`).join('');
  const list = Object.values(J.eggs).sort((a, b) => a.year - b.year);
  q('.jeggs').innerHTML = `<div class="eh">路上遇见的小事 · ${list.length}</div>` + (list.length ? list.map(v => `<div class="egg">✦ ${v.title}<span>${v.note} · 第 ${v.year + 1} 年</span></div>`).join('') : `<div class="egg dim">有些相遇，藏在慢慢走的日子里。</div>`);
}
function toggleJournal(open = !journalOpen) {
  if (!started) return;
  journalOpen = open; journalYear = J.age;
  if (open) { showJournal(); q('#journal').classList.remove('hidden'); q('#touch').classList.add('hidden'); send('pause:1'); }
  else { q('#journal').classList.add('hidden'); if (touch) q('#touch').classList.remove('hidden'); send('pause:0'); document.getElementById('tuanjie-canvas').focus(); }
}
function flip(d) { const ny = journalYear + d; if (ny >= 0 && ny <= J.age) { journalYear = ny; showJournal(); } }
window.BananaUI = {
  setTerm(i, age) {
    const [name, chapter, season] = TERMS[i];
    q('#chapter .num').textContent = String(i + 1).padStart(2, '0') + ' / 24'; q('#chapter .name').textContent = name + ' · ' + chapter; q('#chapter .season').textContent = SEASON_NAMES[season];
    const el = q('#chapter'); if (lastTerm !== i) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); lastTerm = i; }
    q('#age').textContent = age > 0 ? `${age} 岁 · 第 ${age + 1} 年` : '第 1 年';
    J.age = Math.max(J.age, age); const yr = J.years[age] = J.years[age] || { seen: [] };
    if (!yr.seen.includes(i)) { yr.seen.push(i); saveJ(); }
  },
  egg(key, title, note, year) { J.eggs[key + ':' + year] = { title, note, year }; saveJ(); this.toast('✦ ' + title); },
  say(t) { subQ.push(t); },
  toast(t) { const el = q('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(this._tt); this._tt = setTimeout(() => el.classList.remove('show'), 3800); },
  hint(t) { const el = q('#hint'); if (el.textContent !== t) el.textContent = t; el.classList.toggle('show', !!t); },
  audioState(snow, rain, leaf, night, water, sitting) { Object.assign(A, { snow, rain, leaf, night, water, sitting }); q('[data-act=sit]').textContent = sitting ? '起' : '坐'; },
  step(snow) { if (audio.ctx && !muted) audio.step(!!snow); },
  ready() { ready = true; q('#status').textContent = touch ? '轻触屏幕，出发' : '按任意键，出发'; q('#bar').style.opacity = 0; },
};
function begin() {
  if (!ready || started) return; started = true;
  q('#title').classList.add('hidden'); if (touch) q('#touch').classList.remove('hidden');
  audio.start(); audio.setMuted(muted); send('begin');
  document.getElementById('tuanjie-canvas').focus();
}
addEventListener('keydown', begin); addEventListener('pointerdown', e => { if (!e.target.closest('[data-act]')) begin(); audio.unlock && started && audio.unlock(); }, true);
addEventListener('keydown', e => {
  if (!started) return;
  if (e.code === 'KeyN') toggleMute();
  if (e.code === 'KeyJ') toggleJournal();
  if (journalOpen) { if (e.code === 'Escape') toggleJournal(false); if (e.code === 'ArrowLeft') flip(-1); if (e.code === 'ArrowRight') flip(1); }
});
q('#journal').addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-act]');
  if (el) { e.preventDefault(); const a = el.dataset.act; if (a === 'journal') toggleJournal(false); if (a === 'jprev') flip(-1); if (a === 'jnext') flip(1); return; }
  if (!e.target.closest('.paper')) { e.preventDefault(); toggleJournal(false); }
});
function toggleMute() { muted = !muted; audio.setMuted(muted); q('[data-act=mute]').textContent = muted ? '🔇' : '🔊'; }
// on-screen controls
const held = new Map();
q('#touch').addEventListener('pointerdown', e => { const el = e.target.closest('[data-act]'); if (!el) return; e.preventDefault(); const a = el.dataset.act; el.classList.add('on');
  if (a === 'left' || a === 'right') { held.set(e.pointerId, { el, a }); send(a + ':1'); } else { held.set(e.pointerId, { el, a: null }); if (a === 'mute') toggleMute(); else if (a === 'journal') toggleJournal(); else send(a); } });
const end = e => { const h = held.get(e.pointerId); if (!h) return; h.el.classList.remove('on'); if (h.a) send(h.a + ':0'); held.delete(e.pointerId); };
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => q('#touch').addEventListener(ev, end));
// layout + per-frame UI work (subtitles, ambience)
function fit() { const w = innerWidth, h = innerHeight, k = Math.min(1.25, Math.max(Math.min(w / 1280, h / 720), Math.min(w, h) / 760)); root.style.transform = `scale(${k})`; root.style.width = (w / k) + 'px'; root.style.height = (h / k) + 'px'; }
addEventListener('resize', fit); fit();
function loop(now) {
  requestAnimationFrame(loop); const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const el = q('#sub');
  if (subCur) { subT -= dt; if (subT <= 0) { el.classList.remove('show'); subCur = null; subT = 1.2; } }
  else if (subT > 0) subT -= dt;
  else if (subQ.length) { subCur = subQ.shift(); el.textContent = subCur; el.classList.add('show'); subT = 6; }
  if (audio.ctx) audio.update(dt, { snow: A.snow, rain: A.rain, leaf: A.leaf, night: A.night }, { speed: 0, onGround: true, sitting: !!A.sitting }, null, A.water);
}
requestAnimationFrame(loop);
document.addEventListener('visibilitychange', () => { if (document.hidden) audio.suspend(); else audio.resume(); });
createTuanjieInstance(document.getElementById('tuanjie-canvas'), {
  dataUrl: "Build/web.data.unityweb",
  frameworkUrl: "Build/web.framework.js.unityweb",
  codeUrl: "Build/web.wasm.unityweb",
  streamingAssetsUrl: "StreamingAssets",
  companyName: "haochen2115",
  productName: "Banana的岁时漫游",
  productVersion: "1.0",
  devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
}, p => { q('#bar i').style.width = Math.round(p * 100) + '%'; q('#status').textContent = '正在长出森林… ' + Math.round(p * 100) + '%'; })
  .then(i => { inst = i; window.__tj = i; })
  .catch(e => { q('#status').textContent = '这台设备暂时打不开 WebGL2：' + e; });
</script>
</body>
</html>
